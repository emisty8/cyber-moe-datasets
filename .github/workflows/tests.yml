name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run cyber-data build --config configs/fixtures.yaml --output outputs/ci
      - run: uv run cyber-data build --config configs/soc_fixtures.yaml --output outputs/soc-ci
      - run: uv run cyber-data validate-mcp data/fixtures/soc/mcp.jsonl --schema configs/mcp/synthetic-splunk-v1.json
      - run: uv run cyber-data verify-release data/releases/mitre-pilot-v0.2
      - run: uv run cyber-data audit-publication
