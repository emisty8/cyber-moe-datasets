[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cyber-moe-datasets"
version = "0.1.0"
description = "Provenance-preserving cybersecurity dataset preparation for Qwen3 MoE experiments"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
tokenizer = ["transformers>=4.51,<5", "Jinja2>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
cyber-data = "cyber_moe_datasets.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional external integration"]

[tool.ruff]
line-length = 100
extend-exclude = ["data/research", "data/raw", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

